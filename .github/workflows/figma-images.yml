# Кнопка «Run workflow»: выкачивает все картинки из Figma в assets/img/ и коммитит их.
# Один раз: Settings → Secrets and variables → Actions → New repository secret
#   Name: FIGMA_TOKEN   Value: токен из Figma (Settings → Security → Personal access tokens)
# Потом: вкладка Actions → «Картинки из Figma» → Run workflow.
name: Картинки из Figma

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Выгрузить картинки
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
        run: |
          if [ -z "$FIGMA_TOKEN" ]; then
            echo "::error::Добавь секрет FIGMA_TOKEN: Settings → Secrets and variables → Actions"
            exit 1
          fi
          python tools/figma_export.py

      - name: Закоммитить
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/img
          if git diff --cached --quiet; then
            echo "Картинки не изменились"
          else
            git commit -m "Картинки из Figma"
            git push
          fi
