<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#171718" />
  <title>Void Play</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Unbounded:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <!-- Фоновый паттерн (дудлы из Figma) -->
  <div class="bg-pattern" aria-hidden="true"></div>

  <!-- Экран загрузки -->
  <section id="loader" class="loader">
    <div class="loader__brand">
      <img class="loader__logo" src="assets/img/logo.png" alt="" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'loader__logo loader__logo--fallback'}))" />
      <div class="loader__title">VOID PLAY</div>
    </div>
    <div class="loader__bottom">
      <div class="loader__welcome" data-i18n="loader.welcome">Welcome 2 Void Play</div>
      <div class="loader__bar"><div class="loader__fill" id="loaderFill"></div></div>
    </div>
  </section>

  <!-- Приложение -->
  <div id="app" class="app" hidden>
    <header class="head" id="head"></header>
    <main id="screen" class="screen"></main>
    <nav class="nav" id="nav"></nav>
  </div>

  <!-- Слои поверх -->
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <div id="overlay" class="overlay" hidden></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
