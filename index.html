<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#171718" />
  <title>Void Play</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Unbounded:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  
</head>
<body>
  <!-- ===== Экран загрузки ===== -->
  <section id="loader" aria-label="Загрузка">
    <div class="vpl-pattern" aria-hidden="true"></div>

    <div class="vpl-stage">
      <div class="vpl-brand">
        <!-- логотип: «чёрная дыра» с кольцом (Figma: Group 1) -->
        <svg class="vpl-logo" viewBox="0 0 120 120" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
          <defs><clipPath id="vpl-top"><rect x="0" y="0" width="120" height="61"/></clipPath></defs>
          <!-- низ планеты под тарелкой -->
          <path d="M41.5 69A18.5 12 0 0 0 78.5 69Z" fill="#000" stroke="#000" stroke-width="6.5" stroke-linejoin="round"/>
          <path d="M43 69A17 10.5 0 0 0 77 69Z" fill="#000" stroke="#fff" stroke-width="3" stroke-linejoin="round"/>
          <!-- силуэт тарелки: тонкая чёрная обводка вокруг белого -->
          <g stroke="#000" stroke-width="4.5" fill="#000">
            <ellipse cx="60" cy="61" rx="38" ry="10"/>
            <circle cx="60" cy="59" r="21" clip-path="url(#vpl-top)"/>
          </g>
          <ellipse cx="60" cy="61" rx="38" ry="10" fill="#fff"/>
          <circle cx="60" cy="59" r="21" fill="#fff" clip-path="url(#vpl-top)"/>
          <!-- чёрный купол -->
          <path d="M41.5 60A18.5 18.5 0 0 1 78.5 60Q60 66 41.5 60Z" fill="#000"/>
        </svg>
        <div class="vpl-title">VOID PLAY</div>
      </div>

      <div class="vpl-bottom">
        <div class="loader__welcome" data-i18n="loader.welcome">Welcome 2 Void Play</div>
        <div class="vpl-bar"><div class="vpl-fill" id="loaderFill"></div></div>
      </div>
    </div>
  </section>

  <!-- Приложение -->
  <div id="app" class="app" hidden>
    <header class="head" id="head"></header>
    <main id="screen" class="screen"></main>
    <nav class="nav" id="nav"></nav>
  </div>

  <!-- Слои поверх -->
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <div id="overlay" class="overlay" hidden></div>

  <script>
    // Если что-то сломалось и приложение не запустилось — показываем причину на экране загрузки
    (function () {
      var errs = [];
      window.addEventListener('error', function (e) {
        var src = (e.filename || (e.target && (e.target.src || e.target.href)) || '').split('/').slice(-2).join('/');
        errs.push((e.message || 'не загрузился файл') + (src ? ' (' + src + ')' : ''));
      }, true);
      window.addEventListener('unhandledrejection', function (e) { errs.push(String(e.reason && e.reason.message || e.reason)); });
      setTimeout(function () {
        var l = document.getElementById('loader');
        if (!l || l.classList.contains('is-done')) return;
        var w = l.querySelector('.loader__welcome');
        if (!w) return;
        w.style.cssText = 'font-size:12px;line-height:1.4;color:#ff6b81;text-align:center;max-width:300px;white-space:normal';
        w.textContent = window.__vpStarted
          ? 'Сервер не отвечает. Проверь, что бот запущен.' + (errs.length ? ' ' + errs.join(' · ') : '')
          : 'Ошибка запуска — не все файлы на месте (index.html, style.css, core.js, screens.js, app.js). ' + errs.join(' · ');
      }, 12000);
    })();
  </script>
  <script src="core.js" defer></script>
  <script src="screens.js" defer></script>
  <script src="app.js" defer></script>
</body>
</html>
