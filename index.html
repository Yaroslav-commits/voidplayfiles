<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#06060b" />
  <meta name="color-scheme" content="dark" />
  <title>Void Play</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Unbounded:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/app.css" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="config.js"></script>
</head>
<body>
  <!-- живой фон: туманность + звёздная пыль -->
  <div class="bg" aria-hidden="true"><i class="bg__a"></i><i class="bg__b"></i><i class="bg__c"></i><i class="bg__dust"></i></div>

  <!-- ===== Экран загрузки ===== -->
  <section id="loader" class="loader" aria-label="Загрузка">
    <div class="loader__mid">
      <div class="logo">
        <span class="logo__orbit logo__orbit--1"></span>
        <span class="logo__orbit logo__orbit--2"></span>
        <svg class="logo__mark" viewBox="0 0 120 120" aria-hidden="true">
          <defs>
            <linearGradient id="lg1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9db7ff"/><stop offset=".55" stop-color="#3d6bff"/><stop offset="1" stop-color="#ff3d7f"/></linearGradient>
            <clipPath id="lgTop"><rect x="0" y="0" width="120" height="61"/></clipPath>
          </defs>
          <path d="M43 69A17 10.5 0 0 0 77 69Z" fill="#06060b" stroke="url(#lg1)" stroke-width="3" stroke-linejoin="round"/>
          <ellipse cx="60" cy="61" rx="38" ry="10" fill="url(#lg1)"/>
          <circle cx="60" cy="59" r="21" fill="url(#lg1)" clip-path="url(#lgTop)"/>
          <path d="M41.5 60A18.5 18.5 0 0 1 78.5 60Q60 66 41.5 60Z" fill="#06060b"/>
        </svg>
      </div>
      <div class="loader__title" id="brand">VOID PLAY</div>
      <div class="loader__bar"><i id="loaderFill"></i></div>
      <div id="bootMsg"></div>
    </div>
  </section>

  <!-- ===== Приложение ===== -->
  <div id="app" class="app" hidden>
    <header class="top" id="head"></header>
    <div class="netbar" id="netbar"></div>
    <main id="screen" class="screen"></main>
    <nav class="nav" id="nav"></nav>
  </div>

  <div id="toasts" class="toasts" aria-live="polite"></div>
  <div id="overlay" class="overlay"></div>

  <script>
    // название проекта из config.js
    (function () {
      var n = (window.VOIDPLAY_CONFIG && window.VOIDPLAY_CONFIG.APP_NAME) || 'Void Play';
      document.title = n; document.getElementById('brand').textContent = n.toUpperCase();
    })();
    // если скрипты не загрузились — пишем причину на экране загрузки
    (function () {
      var errs = [];
      window.addEventListener('error', function (e) {
        var src = (e.filename || (e.target && (e.target.src || e.target.href)) || '').split('/').slice(-2).join('/');
        errs.push((e.message || 'файл не загрузился') + (src ? ' (' + src + ')' : ''));
      }, true);
      setTimeout(function () {
        if (window.__vpStarted) return;
        var m = document.getElementById('bootMsg');
        if (m) m.innerHTML = '<p class="bootfail">Ошибка запуска: ' + errs.join(' · ').replace(/</g, '&lt;') + '</p>';
      }, 8000);
    })();
  </script>
  <script src="js/core.js" defer></script>
  <script src="js/screens.js" defer></script>
  <script src="js/app.js" defer></script>
</body>
</html>
